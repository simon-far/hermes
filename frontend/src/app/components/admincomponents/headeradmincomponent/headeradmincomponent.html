<!-- Cabecera principal del panel de administración -->
<header class="admin-header">

  <!-- LOGOTIPO: redirige a la raíz del módulo admin -->
  <a routerLink="/admin" class="admin-brand">

    <div class="brand-icon">
      <i class="fa-solid fa-code"></i>
    </div>

    <div class="brand-info">
      <span class="brand-name">Code<span>Shift</span></span>
      <span class="brand-subtitle">ADMIN PANEL</span>
    </div>

  </a>


  <!-- NAVEGACIÓN: enlaces principales con estado activo automático -->
  <nav class="admin-navigation">

    <!-- exact: true evita que 'Inicio' quede activo en las subrutas -->
    <a routerLink="/admin/principaladmin"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }"
       class="nav-link">

      <i class="fa-solid fa-house"></i>
      <span>Inicio</span>

    </a>

    <a routerLink="/admin/usuarios"
       routerLinkActive="active"
       class="nav-link">

      <i class="fa-solid fa-users"></i>
      <span>Usuarios</span>

    </a>

    <a routerLink="/admin/solicitudes"
       routerLinkActive="active"
       class="nav-link">

      <i class="fa-solid fa-inbox"></i>
      <span>Solicitudes</span>

    </a>

    <a routerLink="/admin/reportes"
       routerLinkActive="active"
       class="nav-link">

      <i class="fa-solid fa-chart-column"></i>
      <span>Reportes</span>

    </a>

  </nav>


  <!-- PERFIL: muestra el usuario autenticado y controla el dropdown -->
  <div class="admin-profile">

    <button
      class="profile-button"
      type="button"
      (click)="alternarMenuPerfil()">

      <div class="profile-avatar">
        <i class="fa-solid fa-user"></i>
      </div>

      <div class="profile-info">
        <span class="profile-name">{{ usuarioActual }}</span>
        <span class="profile-role">Administrador</span>
      </div>

      <!-- Rota la flecha cuando el menú está abierto -->
      <i
        class="fa-solid fa-chevron-down profile-arrow"
        [class.rotated]="menuPerfilAbierto">
      </i>

    </button>


    <!-- MENÚ DESPLEGABLE: visible solo cuando menuPerfilAbierto es true -->
    <div class="profile-dropdown" *ngIf="menuPerfilAbierto">

      <div class="dropdown-header">
        <span>Cuenta administrativa</span>
      </div>

      <button type="button" class="dropdown-item">
        <i class="fa-regular fa-user"></i>
        Mi perfil
      </button>

      <button type="button" class="dropdown-item">
        <i class="fa-solid fa-gear"></i>
        Configuración
      </button>

      <div class="dropdown-divider"></div>

      <!-- Dispara el cierre de sesión en el componente -->
      <button type="button" class="dropdown-item logout" (click)="cerrarSesion()">
        <i class="fa-solid fa-right-from-bracket"></i>
        Cerrar sesión
      </button>

    </div>

  </div>

</header>
