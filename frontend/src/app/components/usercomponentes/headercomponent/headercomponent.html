<!-- Modal de inicio de sesión (Bootstrap) -->
<div
  class=" modal fade
    "
  id="modalLogin"
  tabindex="-1"
  aria-labelledby="modalLoginLabel"
  aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="card">

        <!-- Botón de cierre del modal -->
        <button
          type="button"
          class="cerrar-modal"
          data-bs-dismiss="modal"
          aria-label="Cerrar">
          &times;
        </button>

        <div class="contenido-login">
          <h2 id="modalLoginLabel">Iniciar sesión</h2>

          <!-- Formulario reactivo de autenticación -->
          <form [formGroup]="formularioLogin" (ngSubmit)="iniciarSesion()">
            <div class="campo">
              <label for="usuarioLogin">Usuario</label>
              <input
                type="text"
                id="usuarioLogin"
                name="usuarioLogin"
                formControlName="username"
                placeholder="Ingresa tu usuario"
                autocomplete="username"
                required>
            </div>

            <div class="campo">
              <label for="clave">Contraseña</label>
              <input
                type="password"
                id="clave"
                name="clave"
                formControlName="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
                required>
            </div>

            <!-- Deshabilitado mientras la solicitud de inicio de sesión está en curso -->
            <button type="submit" class="btn-login" [disabled]="cargandoLogin">
              {{ cargandoLogin ? 'Ingresando…' : 'Iniciar sesión' }}
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>


<!-- Modal de registro de nuevos usuarios (Bootstrap) -->
<div
  class="modal fade"
  id="modalRegistro"
  tabindex="-1"
  aria-labelledby="modalRegistroLabel"
  aria-hidden="true">

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="card">

        <!-- Botón para cerrar -->
        <button
          type="button"
          class="cerrar-modal"
          data-bs-dismiss="modal"
          aria-label="Cerrar">
          &times;
        </button>

        <div class="contenido-login">
          <h2 id="modalRegistroLabel">Crear cuenta</h2>

          <!-- Formulario reactivo de registro -->
          <form [formGroup]="formulario" (ngSubmit)="registrar()">
            <!-- Nombre -->
            <div class="campo">
              <label for="username">Nombre completo</label>
              <input
                type="text"
                id="username"
                name="username"
                formControlName="username"
                placeholder="Ingresa tu nombre"
                autocomplete="name"
                required>
            </div>

            <!-- Correo -->
            <div class="campo">
              <label for="email">Correo electrónico</label>
              <input
                type="email"
                id="email"
                name="email"
                formControlName="email"
                placeholder="Ingresa tu correo"
                autocomplete="email"
                required>
            </div>

            <!-- Contraseña -->
            <div class="campo">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="clave"
                formControlName="password"
                placeholder="Crea una contraseña"
                autocomplete="new-password"
                required>
            </div>

            <button type="submit" class="btn-login">
              Crear cuenta
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
